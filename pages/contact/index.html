    <!-- ============ PAGE HEADER ============ -->
    <section class="page-header container">
      <p class="eyebrow">Contact</p>
      <h1>Let's <span class="accent">work together</span>.</h1>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="section section-tight" id="contact">
      <div class="container">
        <p class="section-sub reveal">I'm currently open to new opportunities. Reach out and I'll get back to you soon.</p>
        <div class="contact-grid">
          <form id="contactForm" class="contact-form reveal">
            <div class="form-row">
              <label>Name<input type="text" name="name" required autocomplete="name" /></label>
              <label>Email<input type="email" name="email" required autocomplete="email" /></label>
            </div>
            <label>Message<textarea name="message" rows="6" required></textarea></label>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p class="form-status" id="formStatus" role="status"></p>
          </form>
          <div class="contact-side reveal" id="contactSide"></div>
        </div>
      </div>
    </section>
